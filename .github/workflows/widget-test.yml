name: Widget Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  widget-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Pub get
        run: flutter pub get

      - name: Run plugin view test
        run: flutter test test/widget/plugin_view_page_test.dart -r expanded 2>&1 | tail -300
