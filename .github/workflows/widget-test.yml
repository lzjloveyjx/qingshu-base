name: Widget Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  widget-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Pub get
        run: flutter pub get

      # 注意别写成 `flutter test ... | tail -300`：管道把退出码换成了 tail 的，
      # 测试失败也会显示 success（2026-11-26 踩过一次，白跑一轮）。
      # 用 PIPESTATUS 取回 flutter 自己的退出码。
      - name: Run plugin view test
        shell: bash
        run: |
          set -o pipefail
          flutter test test/widget/plugin_view_page_test.dart -r expanded 2>&1 | tail -300
