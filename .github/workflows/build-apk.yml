name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # runner 只有约 14GB 可用空间，NDK + CMake + 全套 native 编译会把它吃光
      # （上一轮在 mergeReleaseNativeLibs 报 "No space left on device"，只剩 81MB）。
      # 先删掉预装的无用 SDK 腾空间。
      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo apt-get clean
          echo "=== after ==="
          df -h / | tail -1

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Derive version from tag
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            NAME="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d+ -f1)"
            echo "::warning::ref '$TAG' 不含版本号，回退到 pubspec: $NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "resolved: $NAME+${GITHUB_RUN_NUMBER}"

      - name: Install dependencies
        run: flutter pub get

      # flutter_inappwebview_android 1.1.3 的 build.gradle 用了
      # getDefaultProguardFile('proguard-android.txt')，新版 AGP 直接拒绝评估
      # 这个项目（"is no longer supported since it includes -dontoptimize"）。
      # 上游 master 已修成 proguard-android-optimize.txt，但 1.1.3 这个发布版
      # 没带上。这里在 CI 里就地打补丁：只改这一行，不动包的其他内容。
      - name: Patch flutter_inappwebview_android proguard file
        run: |
          set -euo pipefail
          # PUB_CACHE 在 CI 上是 /home/runner/.pub-cache，但不要写死：
          # 用 pub cache 实际报告的路径去找，避免 runner 换布局后静默跳过补丁。
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          # 注意要排除 example/：包里有一份 example/android/build.gradle，
          # 它同样匹配 *android/build.gradle，find -print -quit 会先命中它，
          # 于是真正参与构建的那份没被改（上一轮就是这么白跑的）。
          ROOT="$(find "$CACHE_DIR" -maxdepth 4 -type d -name 'flutter_inappwebview_android-*' -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "::error::找不到 flutter_inappwebview_android 包目录（CACHE_DIR=$CACHE_DIR）"
            exit 1
          fi
          TARGET="$ROOT/android/build.gradle"
          if [ ! -f "$TARGET" ]; then
            echo "::error::找不到 $TARGET"
            exit 1
          fi
          echo "package root: $ROOT"
          echo "patched file: $TARGET"
          sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$TARGET"
          echo "--- 补丁后 ---"
          grep -n "getDefaultProguardFile" "$TARGET" || true
          # 确认真的没有残留的旧写法，否则直接失败，别让构建跑到一半才报
          if grep -q "proguard-android\.txt" "$TARGET"; then
            echo "::error::补丁未生效，仍存在 proguard-android.txt"
            exit 1
          fi

      - name: Build APK
        run: |
          # 只出 arm64：现代手机基本都支持，且能把 native 编译产物砍掉一半
          # （上一轮磁盘满就发生在 x86_64 那套 native 库上）。
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.build }}"
          ls -lh build/app/outputs/flutter-apk/ || true
          echo "=== 剩余空间 ==="
          df -h / | tail -1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qingshu-base-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
