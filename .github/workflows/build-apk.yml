name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  # 【青枢】出包前的质量门。
  #
  # 之前 build-apk.yml 里没有任何测试步骤：它只编 Rust、编 APK、传包。
  # 唯一跑全量 flutter test 的是 android-apk.yml 的 dart-gate，而那条
  # 流水线历史上一直在失败，久而久之没人看了 —— 于是 about_page_test
  # 断言「支持作者」这种早就删掉的 UI 也能一直红着，包照样发出去。
  #
  # 现在把门放回出包路径上：测试不过就不出包。
  #
  # 只 analyze 主壳 lib/ 是有意为之：packages/kazumi 里 menu.dart 继承了
  # 上游 4 个历史 error（引用了不存在的 pages/router.dart），那是死代码，
  # 不属于本次改动范围，不该拦发布。
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze main shell
        run: flutter analyze --no-pub lib

      # 注意别用管道接 tail：退出码会被换成 tail 的，测试红了也显示绿。
      - name: Run full widget test suite
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=4 --reporter compact 2>&1 | tail -200

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # runner 只有约 14GB 可用空间，NDK + CMake + 全套 native 编译会把它吃光
      # （上一轮在 mergeReleaseNativeLibs 报 "No space left on device"，只剩 81MB）。
      # 先删掉预装的无用 SDK 腾空间。
      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo apt-get clean
          echo "=== after ==="
          df -h / | tail -1

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      # 版本号以 pubspec.yaml 为唯一事实来源。
      #
      # 之前是「tag 优先，没 tag 才读 pubspec」，结果是：只要忘打 tag，
      # 发出去的包 versionName 就一直是 pubspec 里那个旧值（2.2.0），
      # 用户装完根本分不清是不是新版。改成 pubspec 优先；打 tag 时
      # 额外校验两者一致，不一致直接失败，避免 tag 和包内容对不上。
      - name: Derive version
        id: ver
        run: |
          set -euo pipefail
          NAME="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d+ -f1)"
          if [ -z "$NAME" ]; then
            echo "::error::pubspec.yaml 里读不到 version:"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            TAGVER="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            if [ "$TAGVER" != "$NAME" ]; then
              echo "::error::tag ($TAGVER) 与 pubspec ($NAME) 不一致，先改 pubspec 再打 tag"
              exit 1
            fi
            echo "tag 与 pubspec 一致: $NAME"
          else
            echo "ref '$TAG' 不是版本 tag，按 pubspec 出包: $NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "resolved: $NAME+${GITHUB_RUN_NUMBER}"

      # ---- Rust 后端核心 -------------------------------------------------
      # libfqapi_core.so 是整个后端（番剧源/规则/同步）的依赖，缺了它
      # BackendService 起不来，运行日志里会刷
      # "Failed to load dynamic library libfqapi_core.so"。
      #
      # 这个 workflow 早期不编 Rust，等于一直在发没有后端的包。
      # 现在补上，与 android-apk.yml 用同一份构建脚本。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: flutter pub get

      # flutter_inappwebview_android 1.1.3 的 build.gradle 用了
      # getDefaultProguardFile('proguard-android.txt')，新版 AGP 直接拒绝评估
      # 这个项目（"is no longer supported since it includes -dontoptimize"）。
      # 上游 master 已修成 proguard-android-optimize.txt，但 1.1.3 这个发布版
      # 没带上。这里在 CI 里就地打补丁：只改这一行，不动包的其他内容。
      - name: Patch flutter_inappwebview_android proguard file
        run: |
          set -euo pipefail
          # PUB_CACHE 在 CI 上是 /home/runner/.pub-cache，但不要写死：
          # 用 pub cache 实际报告的路径去找，避免 runner 换布局后静默跳过补丁。
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          # 注意要排除 example/：包里有一份 example/android/build.gradle，
          # 它同样匹配 *android/build.gradle，find -print -quit 会先命中它，
          # 于是真正参与构建的那份没被改（上一轮就是这么白跑的）。
          ROOT="$(find "$CACHE_DIR" -maxdepth 4 -type d -name 'flutter_inappwebview_android-*' -print -quit)"
          if [ -z "$ROOT" ]; then
            echo "::error::找不到 flutter_inappwebview_android 包目录（CACHE_DIR=$CACHE_DIR）"
            exit 1
          fi
          TARGET="$ROOT/android/build.gradle"
          if [ ! -f "$TARGET" ]; then
            echo "::error::找不到 $TARGET"
            exit 1
          fi
          echo "package root: $ROOT"
          echo "patched file: $TARGET"
          sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$TARGET"
          echo "--- 补丁后 ---"
          grep -n "getDefaultProguardFile" "$TARGET" || true
          # 确认真的没有残留的旧写法，否则直接失败，别让构建跑到一半才报
          if grep -q "proguard-android\.txt" "$TARGET"; then
            echo "::error::补丁未生效，仍存在 proguard-android.txt"
            exit 1
          fi

      # 装 NDK：scripts/build_rust_backend.sh 要求 pinned 版本，
      # 缺失时它直接报错而不是退回最新版（避免工具链悄悄漂移）。
      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          # runner 上 SDK 位置不固定，且 ANDROID_HOME 未必导出到这一步。
          # 逐个候选探测，找不到 sdkmanager 就直接报错（不要静默跳过，
          # 否则后面 Rust 交叉编译会在更难懂的地方失败）。
          SDK_ROOT=""
          for cand in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                      /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            [ -n "$cand" ] || continue
            if [ -x "$cand/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDK_ROOT="$cand"; break
            fi
          done
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::找不到 sdkmanager（尝试过 ANDROID_HOME / ANDROID_SDK_ROOT / /usr/local/lib/android/sdk）"
            ls -d /usr/local/lib/android/* 2>/dev/null || true
            exit 1
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          if [ ! -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "安装 NDK $NDK_VERSION ..."
            # 不要用 `yes | sdkmanager`：sdkmanager 先退出时 yes 收到 SIGPIPE，
            # 配合 set -o pipefail 会把一条本来成功的安装判成失败
            # （上一轮就是这样：下载到 23% 时日志里冒 "yes: standard output:
            # Broken pipe"，紧接着 NDK 安装失败 —— 其实包根本没装完就 abort 了）。
            # 许可证改用 --licenses 单独接受，NDK 安装只跑一次。
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            "$SDKM" --licenses < /dev/null > /dev/null 2>&1 || true
            if ! "$SDKM" "ndk;$NDK_VERSION" > /tmp/ndk-install.log 2>&1; then
              echo "::error::NDK 安装失败"
              tail -30 /tmp/ndk-install.log
              exit 1
            fi
          fi
          test -d "$SDK_ROOT/ndk/$NDK_VERSION" || { echo "::error::NDK 目录不存在"; exit 1; }
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Compile the Rust core for Android
        run: bash scripts/build_rust_backend.sh --skip-codegen

      - name: Verify the Rust core libraries
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            so="android/app/src/main/jniLibs/$abi/libfqapi_core.so"
            test -s "$so" || { echo "::error::$so 缺失"; exit 1; }
            echo "$abi: $(stat -c%s "$so") 字节"
          done

      # 签名材料从 Secrets 注入，仓库里不留密钥。缺 Secrets 时下面这步
      # 会跳过，最终产出的包未签名 —— 但 build.gradle.kts 会直接让
      # release 构建失败，所以不会出现"发出去却装不上"的包。
      - name: Restore release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，release 构建将失败（这是有意的）"
            exit 0
          fi
          mkdir -p android
          printf "%s" "$KEYSTORE_BASE64" | base64 -d > android/app/qingshu-release.keystore
          {
            echo "storeFile=app/qingshu-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      # 给 CI 换 Gradle 下载源。
      #
      # distributionUrl 指向 services.gradle.org，它会 307 到
      # github.com/gradle/gradle-distributions 的 release 资产；GitHub 对
      # Actions 出口 IP 的这类下载会间歇性回 403。2026-11-27 的 v2.4.2 tag
      # 构建就挂在这里：
      #
      #   java.io.IOException: Server returned HTTP response code: 403 for URL:
      #   https://github.com/gradle/gradle-distributions/releases/download/
      #   v9.5.0/gradle-9.5.0-all.zip
      #
      # 同一份代码的 master 构建 11 分钟前刚成功过，所以不是代码问题，是
      # GitHub 对这个出口 IP 的限流。
      #
      # 做法：只在 CI 里把 distributionUrl 换成国内镜像（实测三个源都是 200，
      # 且 Content-Length 与官方包一致 = 240667887 字节）。
      # distributionSha256Sum 保持不变 —— 镜像若给了被动过的包，Gradle
      # 自己会校验失败并报错，不会被静默装进去。
      #
      # 只改 runner 上的工作副本，不提交回仓库：本地构建仍走官方源。
      - name: Point Gradle at a reachable mirror
        run: |
          set -euo pipefail
          PROP=android/gradle/wrapper/gradle-wrapper.properties
          # 文件名必须沿用原来的（-all 还是 -bin），否则字节数不同、
          # distributionSha256Sum 对不上，Gradle 会直接报校验失败。
          NAME=$(grep -m1 '^distributionUrl=' "$PROP" | sed -E 's#.*/##')
          [ -n "$NAME" ] || { echo "::error::读不到 gradle 发行包名"; exit 1; }
          echo "发行包: $NAME"
          for BASE in \
            https://mirrors.cloud.tencent.com/gradle \
            https://repo.huaweicloud.com/gradle \
            https://mirrors.aliyun.com/macports/distfiles/gradle; do
            if curl -fsSI --max-time 30 "$BASE/$NAME" >/dev/null 2>&1; then
              # $BASE 已经含协议头（https://host/path），只需要补 .properties
              # 要求的「冒号前加反斜杠」转义，别再拼一遍 https://。
              ESC=$(printf '%s' "$BASE/$NAME" | sed 's#:#\\:#')
              sed -i "s#^distributionUrl=.*#distributionUrl=${ESC}#" "$PROP"
              echo "已指向 $BASE/$NAME"
              grep -n '^distributionUrl=' "$PROP"
              exit 0
            fi
            echo "$BASE 不可达，试下一个"
          done
          echo "::warning::镜像都不可达，保留官方源（wrapper 自带重试）"

      - name: Build APK
        run: |
          # 只出 arm64：现代手机基本都支持，且能把 native 编译产物砍掉一半
          # （上一轮磁盘满就发生在 x86_64 那套 native 库上）。
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.build }}"
          ls -lh build/app/outputs/flutter-apk/ || true
          echo "=== 剩余空间 ==="
          df -h / | tail -1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qingshu-base-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
