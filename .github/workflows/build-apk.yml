name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev

      - name: Derive version from tag
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            NAME="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d+ -f1)"
            echo "::warning::ref '$TAG' 不含版本号，回退到 pubspec: $NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "resolved: $NAME+${GITHUB_RUN_NUMBER}"

      - name: Install dependencies
        run: flutter pub get

      # flutter_inappwebview_android 1.1.3 的 build.gradle 用了
      # getDefaultProguardFile('proguard-android.txt')，新版 AGP 直接拒绝评估
      # 这个项目（"is no longer supported since it includes -dontoptimize"）。
      # 上游 master 已修成 proguard-android-optimize.txt，但 1.1.3 这个发布版
      # 没带上。这里在 CI 里就地打补丁：只改这一行，不动包的其他内容。
      - name: Patch flutter_inappwebview_android proguard file
        run: |
          set -euo pipefail
          # PUB_CACHE 在 CI 上是 /home/runner/.pub-cache，但不要写死：
          # 用 pub cache 实际报告的路径去找，避免 runner 换布局后静默跳过补丁。
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          TARGET="$(find "$CACHE_DIR" -path '*flutter_inappwebview_android-*/android/build.gradle' -print -quit)"
          if [ -z "$TARGET" ] || [ ! -f "$TARGET" ]; then
            echo "::error::找不到 flutter_inappwebview_android 的 build.gradle（CACHE_DIR=$CACHE_DIR）"
            exit 1
          fi
          echo "patched file: $TARGET"
          sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$TARGET"
          echo "--- 补丁后 ---"
          grep -n "getDefaultProguardFile" "$TARGET" || true

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.build }}"
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qingshu-base-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
