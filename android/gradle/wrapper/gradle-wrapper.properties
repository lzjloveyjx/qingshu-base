distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=a3c4ba4aca8f0075688b9c5b18939fd28e8cb4357c227da5c1d9f38343791439
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip
# 【青枢】services.gradle.org 会 302 到 github.com/gradle/gradle-distributions，
# 而 GitHub 对 Actions 出口 IP 的 releases 下载会间歇性回 403。
# 2026-11-27 的 v2.4.2 tag 构建就是因为这个 403 直接失败的
# （同一份代码的 master 构建 11 分钟前刚刚成功，代码本身没问题）。
# 加重试把这类瞬时失败挡掉，别让它再打断发版。
networkTimeout=60000
retries=5
retryBackOffMs=3000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
