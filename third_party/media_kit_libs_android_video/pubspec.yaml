name: media_kit_libs_android_video
description: Android package providing video (& audio) native libraries for package:media_kit.
# 【青枢】本地 fork：android/build.gradle 里的 libmpv 下载地址已从 media-kit 官方
# v1.1.7 换成 Predidit/libmpv-android-video-build v1.3.1（Kazumi 原版用的那份）。
version: 1.3.8
homepage: https://github.com/media-kit/media-kit.git
repository: https://github.com/media-kit/media-kit.git

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.alexmercerind.media_kit_libs_android_video
        pluginClass: MediaKitLibsAndroidVideoPlugin
