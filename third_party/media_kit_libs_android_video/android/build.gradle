import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }
    compileSdkVersion 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdkVersion 16
    }
    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

// ===== 【青枢】换用 Predidit 编译的 libmpv v1.3.1 =====
//
// 为什么：同样源、同样网络，Kazumi 原版流畅而青枢卡顿/加载失败。
// 逐层比对后确认根因是 libmpv 二进制不同：
//
//   media-kit 官方 v1.1.7   arm64 libmpv.so  11.8 MB  sha256 adf83fde...
//   Predidit 版 v1.3.1      arm64 libmpv.so  21.8 MB  sha256 0a40f524...
//
// Kazumi 原版的 media_kit 指向 Predidit/media-kit 的 git 分支，用的就是后者。
// 体积差近一倍，说明编进了更多解码器/滤镜。
//
// 这里只换二进制，不动 media_kit / media_kit_video 的 Dart 包 —— API 兼容，
// 也避免 HANDOVER 6.1 记的「直接依赖 Predidit 分支会牵出一串传递依赖冲突」。

def libmpvTag = 'v1.3.1'
def baseUrl = 'https://github.com/Predidit/libmpv-android-video-build/releases/download/' + libmpvTag

task downloadDependencies(type: Exec) {
        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        def filesToDownload = [
            ['abi': 'arm64-v8a',   'sha256': '3bbceecd7616d5730e19865342a020834f00bdf77c25900e97c91a6e3e8141f8'],
            ['abi': 'armeabi-v7a', 'sha256': '96c37141ef20d1c73da01887f8ad6244aa7fccb44e805457d3eb15d2d71fde20'],
            ['abi': 'x86_64',      'sha256': 'f01e9f1890091f4dd856cd37247e442d151b7815a86306581a1e9317ec566136'],
            ['abi': 'x86',         'sha256': '29919fb6d0e4cd3855ef4c951f1d1e7784889e8715bad3007e718f18b425d4bd']
        ]

        filesToDownload.each { info ->
            def url = baseUrl + '/default-' + info.abi + '.jar'
            def destFile = file("$buildDir/" + libmpvTag + '/' + info.abi + '.jar')
            def expected = info.sha256

            def calc = { File f ->
                MessageDigest.getInstance('SHA-256')
                    .digest(Files.readAllBytes(f.toPath())).encodeHex().toString()
            }

            if (destFile.exists() && calc(destFile) != expected) {
                destFile.delete()
                println 'sha256 mismatch, deleted: ' + destFile
            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                boolean ok = false
                // 国内直连 GitHub release 常被断，失败后走 gh-proxy 重试。
                for (String prefix : ['', 'https://gh-proxy.org/']) {
                    try {
                        println 'Downloading: ' + prefix + url
                        destFile.withOutputStream { os -> os << new URL(prefix + url).openStream() }
                        if (calc(destFile) == expected) { ok = true }
                    } catch (Exception e) {
                        println '  failed: ' + e.message
                    }
                    if (ok) break
                    destFile.delete()
                }
                if (!ok) {
                    throw new GradleException('libmpv download/verify failed: ' + info.abi)
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
